[package]
name = "fast-tools"
version = "0.1.0"
edition = "2021"
authors = ["Enkay <github.com/enkay01>"]
description = "Deterministic high-performance developer tools, batch file reader, and Antigravity lifecycle hooks"

[[bin]]
name = "fast-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"
