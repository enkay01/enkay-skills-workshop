[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wcu-cli"
version = "0.1.0"
description = "Direct-agent Windows computer-use CLI: persistent desktop session, screenshots, and guarded actions for agent hosts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
wcu = "wcu.cli:main"

[tool.setuptools]
packages = ["wcu"]
